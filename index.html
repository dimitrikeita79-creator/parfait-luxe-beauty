<!DOCTYPE html>
<html lang="fr" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Salon de beauté luxe à Ouagadougou — perruques, mèches, tresses, mariage." />
    <meta name="keywords" content="salon, beauté, perruques, coiffure, Ouagadougou" />
    <meta name="author" content="Parfait.design" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://parfaitdesign-desmohair.com/" />
    <title>Parfait.Design/Desmohair</title>
    <base href="/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/DESMOHAIR.jpg" />
    <link rel="apple-touch-icon" href="/DESMOHAIR.jpg" />
    <style>
      html.theme-light body { background: #ffffff; color: #1c1917; opacity: 1; }
      #root { opacity: 1; }
      .glass-nav { -webkit-transform: translateZ(0); transform: translateZ(0); }
      @media (max-width: 768px) {
        .glass, .glass-strong, .liquid-glass, .frame-glass { -webkit-backdrop-filter: blur(6px) saturate(140%); backdrop-filter: blur(6px) saturate(140%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          const loc = window.location;
          if (!loc.origin || loc.origin === 'null') {
            const pathname = loc.pathname || '/';
            const basePath = pathname.includes('/')
              ? pathname.slice(0, pathname.lastIndexOf('/')) || '/'
              : '';
            const fakeOrigin = 'file://' + basePath;
            Object.defineProperty(window.location, 'origin', {
              get: function() { return fakeOrigin; },
              enumerable: true,
              configurable: true
            });
          }
        } catch (e) {
          console.warn('Could not patch window.location.origin:', e);
        }
      })();

      window.addEventListener('error', function(e) {
        console.error('Global error:', e.error || e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e.reason);
      });

      (function() {
        try {
          const originalHydrateRoot = window.ReactDOM?.hydrateRoot;
          if (typeof originalHydrateRoot === 'function') {
            window.ReactDOM.hydrateRoot = function(container, element, options) {
              if (container && container.nodeType === 1) {
                container.innerHTML = '';
              }
              return window.ReactDOM.createRoot(container, { hydrate: false }).render(element);
            };
            console.log('[index.html] hydrateRoot patched to createRoot with hydrate:false');
          }
        } catch(e) {
          console.warn('[index.html] hydrateRoot patch failed:', e);
        }
      })();
    </script>
    <script type="module" src="/src/entry.client.tsx"></script>
  </body>
</html>
